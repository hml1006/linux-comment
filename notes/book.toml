[book]
title = "Linux 7.2 内核源码分析笔记"
authors = ["hml1006"]
language = "zh-CN"
description = "面向 ARM64 的 Linux 7.2 内核源码分析笔记"
# book.toml 位于 notes/ 内，源目录即当前目录：
# 整个 mdBook（配置、源文件、构建产物）都收敛在 notes/ 下，不污染内核源码树根目录
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
# 章节标题已自带编号（如 3.1），关闭 mdBook 自动编号避免重复
no-section-label = true
# 仅本地阅读，不发布 GitHub Pages：不配置 git-repository-url / edit-url-template

[output.html.search]
# 仅本地阅读，关闭搜索索引（避免生成约 23MB 的 searchindex.js）
enable = false

[output.html.fold]
enable = true
# 0 = 折叠第一级带子项的章节（即各 N.x 节），使三级页面默认隐藏
level = 0

[preprocessor.plantuml]
command = "mdbook-plantuml"
# 本机 PlantUML jar；若已安装 plantuml 命令，可改为 plantuml-cmd = "plantuml"
plantuml-cmd = "java -Djava.awt.headless=true -jar /home/louis/backup/plantuml-1.2025.10.jar"
# 渲染结果以 data URI 内嵌到 HTML；缓存文件位于 notes/.mdbook-plantuml-cache
use-data-uris = true
fail-on-error = true

